<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 400" role="img" aria-label="HybriDock-Pep pipeline: peptide and receptor enter through the CLI or UI, driver.py runs Stage 1 GPU pose sampling in the rapidock environment, then hands N poses down to the score environment for clash-relief, ranking, clustering, and the primary AI-pose affinity ΔG, ending in ranked_poses.csv.">
