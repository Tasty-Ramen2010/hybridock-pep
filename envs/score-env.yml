name: score-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - conda-forge::numpy>=1.26
  - conda-forge::scipy>=1.13
  - conda-forge::scikit-learn>=1.8,<1.9
  - conda-forge::matplotlib>=3.8
  - conda-forge::biopython>=1.83
  - conda-forge::openmm>=8.1
  - conda-forge::pdbfixer>=1.9
  - conda-forge::rdkit>=2024.03
  - conda-forge::swig
  # AutoDock4 grid maps. Replaces ADFRsuite's autogrid4 and, unlike ADFRsuite,
  # has a native osx-arm64 build and no license click-through. The GPF's
  # parameter_file directive is optional, so AD4_parameters.dat (which only
  # ADFRsuite ships) is not needed — autogrid4 falls back to its built-in AD4.2
  # parameters. With this plus meeko's mk_prepare_receptor.py, the pipeline no
  # longer requires ADFRsuite at all.
  - conda-forge::autogrid>=4.2.9
  # Last-resort receptor PDBQT conversion when neither meeko nor ADFRsuite is
  # present. See prep/pdbqt_convert.py for why obabel needs different flags
  # than babel.
  - conda-forge::openbabel>=3.1
  # pip's `vina` wheel build hardcodes -std=c++11; boost >=1.87 dropped the
  # std::enable_if_t compatibility shim that relies on, so the build fails
  # with "no member named 'enable_if_t' in namespace 'std'" past that version.
  - conda-forge::libboost-devel>=1.82,<1.87
  - pip:
      - "pydantic>=2.0"
      - "meeko>=0.7"
      - "vina>=1.2.5"
      - "gemmi>=0.6"
      - "rcsbsearch==0.2.3"
