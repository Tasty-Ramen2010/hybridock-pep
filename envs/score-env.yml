name: score-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - conda-forge::numpy>=1.26
  - conda-forge::scipy>=1.13
  - conda-forge::scikit-learn>=1.8,<1.9
  - conda-forge::matplotlib>=3.8
  - conda-forge::biopython>=1.83
  - conda-forge::openmm>=8.1
  - conda-forge::pdbfixer>=1.9
  - conda-forge::rdkit>=2024.03
  - conda-forge::swig
  # Fallback for babel/prepare_receptor when ADFRsuite isn't installed (e.g.
  # Apple Silicon, where ADFRsuite ships only an x86_64 tarball). See
  # prep/pdbqt_convert.py for why obabel needs different flags than babel.
  - conda-forge::openbabel>=3.1
  # pip's `vina` wheel build hardcodes -std=c++11; boost >=1.87 dropped the
  # std::enable_if_t compatibility shim that relies on, so the build fails
  # with "no member named 'enable_if_t' in namespace 'std'" past that version.
  - conda-forge::libboost-devel>=1.82,<1.87
  - pip:
      - "pydantic>=2.0"
      - "meeko>=0.7"
      - "vina>=1.2.5"
      - "gemmi>=0.6"
      - "rcsbsearch==0.2.3"
