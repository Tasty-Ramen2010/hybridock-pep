<!doctype html>
<html lang="en" data-theme="light" data-mode="guided">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HybriDock-Pep: see how a peptide binds a protein</title>
  <meta name="description" content="Pick a protein, type a peptide, and see how tightly they stick. Predicted binding strength with 3D poses.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%231d1d1f' stroke-width='3'/%3E%3Cpath d='M16 3a13 13 0 0 1 0 26z' fill='%231d1d1f'/%3E%3C/svg%3E">

  <!-- One CSS file and one JS module (generated by scripts/build_web.py from static/css/app and static/js/app).
       The local server opens a new connection per file, so fewer files means a page that always starts. If the
       first load is dropped anyway, reload once automatically. Fonts are bundled, so it looks the same offline. -->
  <link rel="modulepreload" href="static/dist/app.mjs">
  <link rel="stylesheet" href="static/dist/app.css" onerror="try{if(!sessionStorage.getItem('hp-retry')){sessionStorage.setItem('hp-retry','1');location.reload();}}catch(e){}">

<script>window.HYBRIDOCK_STATIC = true; /* no server behind this copy: demo mode only */</script>
  <!-- Apply the saved theme/mode before first paint so there is no flash. -->
  <script>
    try {
      const s = JSON.parse(localStorage.getItem('hybridock-web:v1') || '{}');
      // Saved choice first; otherwise follow the system light/dark setting.
      document.documentElement.dataset.theme = s.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (s.mode) document.documentElement.dataset.mode = s.mode;
    } catch (e) { /* storage unavailable: defaults are fine */ }
  </script>
</head>
<body>
  <!-- The single full-page canvas: the floating protein lives here, behind everything. -->
  <canvas id="stage" aria-hidden="true"></canvas>

  <a class="skip-link" href="#main">Skip to main content</a>

  <div id="app">
    <header id="topbar" class="topbar"></header>
    <main id="main" tabindex="-1"></main>
  </div>

  <div id="overlays"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <noscript><p style="padding:2rem">HybriDock-Pep needs JavaScript to draw the 3D protein and run predictions.</p></noscript>

  <!-- If the app hasn't started after a few seconds (most often because index.html was opened by
       double-click, which browsers block for ES modules), say so in plain words instead of a blank page. -->
  <script>
    setTimeout(function () {
      var main = document.getElementById('main');
      if (main && !main.children.length) {
        var onDisk = location.protocol === 'file:';
        main.innerHTML = '<div style="max-width:560px;margin:12vh auto;padding:0 20px;font:16px/1.6 system-ui,sans-serif">' +
          '<h1 style="font:700 30px/1.15 system-ui,sans-serif;margin:0 0 12px">HybriDock-Pep didn’t start</h1>' +
          '<p>' + (onDisk
            ? 'Browsers won’t run this app when the file is opened by double-click. Start the local server instead:'
            : 'Something stopped the app from loading. Check your connection and refresh the page. If you are running it locally, start it with:') + '</p>' +
          '<pre style="background:rgba(127,127,127,.15);padding:12px 14px;border-radius:10px">hybridock-pep serve</pre>' +
          '<p>then open the address it prints (usually <b>http://127.0.0.1:8000</b>).</p></div>';
        main.style.pointerEvents = 'auto';
      }
    }, 6000);
  </script>
  <script type="module" src="static/dist/app.mjs" onerror="try{if(!sessionStorage.getItem('hp-retry')){sessionStorage.setItem('hp-retry','1');location.reload();}}catch(e){}"></script>
</body>
</html>
