[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridock-pep"
version = "0.1.0"
description = "Hybrid peptide docking tool (RAPiDock + physics-based rescoring)"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"  # pinned to match envs/score-env.yml — vina has no cp313 wheel yet
authors = [{ name = "Ram" }]
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
    # Not actually optional: hybridock_pep/__init__.py and driver.py import these
    # unconditionally (scipy via scoring.entropy, openmm via prep.receptor, etc.),
    # so `pip install -e .` must pull them in for the package to import at all.
    "meeko>=0.5",
    "vina>=1.2.5",
    "scipy>=1.11",
    "biopython>=1.81",
    "scikit-learn>=1.8,<1.9",
    "openmm>=8.1",
    "pdbfixer>=1.9",
    # launch_ui.sh / hybridock_pep.ui.tui (the guided terminal UI install.sh
    # auto-launches at the end of setup) imports this unconditionally.
    "prompt_toolkit>=3.0",
    # make verify / make test (the documented judge-facing path) need pytest present
    # right after `pip install -e .` — no separate dev-extras step should be required.
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.optional-dependencies]
# Kept as no-op aliases so `pip install -e ".[scoring]"` etc. from older docs/scripts
# still works — the packages are already pulled in by the base `dependencies` above.
scoring = [
    "meeko>=0.5",
    "vina>=1.2.5",
    "scipy>=1.11",
    "biopython>=1.81",
    "scikit-learn>=1.8,<1.9",
    "pdbfixer>=1.9",
]
mmgbsa = [
    "openmm>=8.1",
]
dev = [
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.9",
]

[project.scripts]
hybridock-pep = "hybridock_pep.cli:main"
# The TUI documents itself as `hybridock-tui` in its own --help and in
# launch_ui.sh's banner, but the console script was never registered, so that
# command did not exist after a normal install.
hybridock-tui = "hybridock_pep.ui.tui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hybridock_pep = ["py.typed"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
markers = [
    "slow: slow integration tests requiring full score-env tool stack (Vina, Meeko, ADFRsuite)",
]
testpaths = ["tests"]
norecursedirs = ["hybridock-pep", "third_party", "envs", "runs", "logs", "data", ".git"]
