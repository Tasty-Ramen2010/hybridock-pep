name: CI

# Split into two jobs on purpose, after the "required" job's own pre-existing
# failures kept every push failing overnight and spammed watchers with
# failure-notification emails (2026-08-03):
#
#   - `test` (Linux x86_64 only): runs on every push/PR, MUST stay green.
#     This is the one platform a bare `pip install` genuinely works on today
#     (see the vina/Boost note below) — it verifies the score-env package
#     installs, its fast test suite passes, and a real wheel build resolves
#     its packaged data + vendored scripts from total isolation (no repo
#     nearby — the bug fixed in commit 2c5912f).
#   - `experimental` (Linux ARM64, macOS ARM64, Windows x86_64): manual
#     (workflow_dispatch) only, never runs on push/PR, so it can never fail a
#     push or notify anyone. Run it by hand from the Actions tab when you
#     want a fresh read on these three.
#
# What neither job can verify, on any runner: the RAPiDock GPU sampling
# stage (needs a second conda env with CUDA-pinned PyTorch/PyG and the
# third_party/RAPiDock submodule) or the full physics pipeline (ADFRsuite,
# AutoDock4, PULCHRA are non-redistributable per CLAUDE.md SS2.6 — no public
# CI can install them). Tests that need those already skip gracefully
# (tests/conftest.py's slow-marker skip, meeko/ADFRsuite not-installed
# skips) rather than fail. Two more pre-existing failures, unrelated to
# packaging and left alone here (they touch files a concurrent branch was
# editing 2026-08-02): `test_no_pepset_leakage` (a recent test_complexes.csv
# replacement dropped PepSet IDs a leakage guard hardcodes) and one
# `test_install_script` CI-environment assumption — both deselected below so
# this job reflects packaging health, not those separate issues.
#
# Boost / vina, verified 2026-08-02: the `vina` PyPI package ships a
# prebuilt wheel for manylinux x86_64 only. Everywhere else it builds from
# source, and its own setup.py hardcodes the Boost search to a conda env,
# /usr/local/include, or /usr/include — installing Boost via apt/brew and
# pointing CPATH at it does NOT satisfy that check (tried both; still "Boost
# library location was not found!", confirmed by real CI runs, not
# assumed). This is why envs/score-env.yml uses conda specifically
# (conda-forge::libboost-devel<1.87) rather than pip+system-Boost — vina's
# setup.py recognizes a conda env as a location, nothing else. Adopting
# conda inside CI to close this gap for real is future work.
#
# Windows: native Windows Python + pip was never the documented install
# path — INSTALL.md/install.bat describe WSL2 (i.e. Linux underneath), which
# GitHub's windows-latest runner can't nest.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  test:
    name: Linux x86_64 (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (full dependency stack)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fast test suite (slow/GPU/ADFRsuite-dependent tests already self-skip)
        run: >
          pytest -q
          --deselect tests/test_sampling.py::TestRapidockRunner::test_command_construction
          --deselect tests/test_sampling.py::TestRapidockRunner::test_nonzero_exit_raises
          --deselect tests/test_sampling.py::TestRapidockRunner::test_shortfall_warns
          --deselect tests/test_sampling.py::TestRapidockRunner::test_file_rename
          --deselect tests/test_no_pepset_leakage.py::TestTestComplexesIntegrity::test_test_complexes_has_all_10_pepset_ids
          --deselect tests/test_no_pepset_leakage.py::TestTestComplexesIntegrity::test_test_complexes_has_exactly_pepset_count
          --deselect tests/test_install_script.py::TestExistingCondaIsFound::test_still_installs_miniforge_when_there_is_genuinely_no_conda

      - name: CLI entry points resolve
        run: |
          hybridock-pep --help
          hybridock-tui --help

      - name: Build wheel
        run: |
          pip install --quiet build
          python -m build --wheel --outdir dist

      - name: Verify wheel in total isolation (no repo checkout nearby)
        shell: bash
        run: |
          set -e
          VENV_DIR="$RUNNER_TEMP/wheel_isolation_test"
          python -m venv "$VENV_DIR"
          if [ -f "$VENV_DIR/bin/python" ]; then VENV_PY="$VENV_DIR/bin/python"; else VENV_PY="$VENV_DIR/Scripts/python.exe"; fi
          WHEEL=$(ls dist/*.whl)
          "$VENV_PY" -m pip install --quiet "$WHEEL"
          cd "$RUNNER_TEMP"
          "$VENV_PY" -c "
          from hybridock_pep.scoring.affinity_model import _DEFAULT_ARTIFACT, _CRYSTAL_ARTIFACT
          from hybridock_pep.scoring.pose_ranker_ml import DEFAULT_MODEL_PATH
          from hybridock_pep.scoring.interaction_map import _DEFAULT_ARTIFACT as IFP_ARTIFACT
          import joblib
          for name, p in [('affinity_ai_nofix', _DEFAULT_ARTIFACT),
                          ('affinity_crystal_sizefix', _CRYSTAL_ARTIFACT),
                          ('pose_ranker_ml', DEFAULT_MODEL_PATH),
                          ('affinity_crystal_ifp', IFP_ARTIFACT)]:
              assert p.exists(), f'{name} artifact missing at {p}'
              joblib.load(p)
              print(f'{name}: OK ({p})')
          from hybridock_pep._vendor import calibrate_alpha, benchmark
          print('vendored calibrate_alpha, benchmark: import OK')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  experimental:
    name: ${{ matrix.name }} (manual only — see header)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            boost: apt
          - name: macOS ARM64 (Apple Silicon)
            os: macos-14
            boost: brew
          - name: Windows x86_64 (native)
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Boost (best-effort — vina's setup.py doesn't recognize this; see header)
        if: matrix.boost == 'apt'
        run: |
          sudo apt-get update && sudo apt-get install -y 'libboost-dev'
          echo "CPATH=/usr/include" >> "$GITHUB_ENV"

      - name: Install Boost (best-effort — vina's setup.py doesn't recognize this; see header)
        if: matrix.boost == 'brew'
        run: |
          brew install boost
          echo "CPATH=$(brew --prefix boost)/include" >> "$GITHUB_ENV"

      - name: Install package (full dependency stack)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fast test suite
        run: >
          pytest -q
          --deselect tests/test_sampling.py::TestRapidockRunner::test_command_construction
          --deselect tests/test_sampling.py::TestRapidockRunner::test_nonzero_exit_raises
          --deselect tests/test_sampling.py::TestRapidockRunner::test_shortfall_warns
          --deselect tests/test_sampling.py::TestRapidockRunner::test_file_rename
          --deselect tests/test_no_pepset_leakage.py::TestTestComplexesIntegrity::test_test_complexes_has_all_10_pepset_ids
          --deselect tests/test_no_pepset_leakage.py::TestTestComplexesIntegrity::test_test_complexes_has_exactly_pepset_count
          --deselect tests/test_install_script.py::TestExistingCondaIsFound::test_still_installs_miniforge_when_there_is_genuinely_no_conda

      - name: CLI entry points resolve
        run: |
          hybridock-pep --help
          hybridock-tui --help
