name: CI

# Verifies what is honestly verifiable on GitHub-hosted runners: that the
# score-env half of the package (src/, tests/) installs and its fast test
# suite passes on each platform/arch, and that a real wheel build resolves
# its packaged data + vendored scripts from a clean install with no repo
# nearby (the exact bug fixed in commit 2c5912f).
#
# What this CANNOT verify, on any runner: the RAPiDock GPU sampling stage
# (needs a second conda env with CUDA-pinned PyTorch/PyG and the
# third_party/RAPiDock submodule) or the full physics pipeline (ADFRsuite,
# AutoDock4, PULCHRA are non-redistributable per CLAUDE.md SS2.6 — no public
# CI can install them). Tests that need those already skip gracefully
# (see tests/conftest.py's slow-marker skip and the meeko/ADFRsuite
# not-installed skips) rather than fail.
#
# Boost: the `vina` PyPI package ships a prebuilt wheel for manylinux x86_64
# only — every other platform/arch builds from source and needs Boost
# headers (envs/score-env.yml already installs
# conda-forge::libboost-devel<1.87 for exactly this reason; >=1.87 dropped
# the std::enable_if_t shim vina's build relies on). CI installs the same
# constraint via each platform's system package manager so this matrix tests
# the real "can pip alone do this" question, not "did we get lucky with a
# wheel".
#
# Windows: native Windows Python + pip was never the documented install
# path — INSTALL.md/install.bat describe WSL2 (i.e. Linux underneath), which
# GitHub's windows-latest runner cannot nest. Kept here anyway as a
# non-blocking signal for the parts that don't need vina (CLI/TUI argument
# parsing, pure-Python scoring logic); marked experimental rather than
# required.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            experimental: true  # newer GA runner class; boost fix is new+unverified here
            boost: apt
          - name: macOS ARM64 (Apple Silicon)
            os: macos-14
            boost: brew
          - name: Windows x86_64 (native — see header; WSL2 is the real target)
            os: windows-latest
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Boost (vina builds from source on this platform)
        if: matrix.boost == 'apt'
        run: sudo apt-get update && sudo apt-get install -y 'libboost-dev'

      - name: Install Boost (vina builds from source on this platform)
        if: matrix.boost == 'brew'
        run: brew install boost

      - name: Install package (full dependency stack)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fast test suite (slow/GPU/ADFRsuite-dependent tests already self-skip)
        run: pytest -q

      - name: CLI entry points resolve
        run: |
          hybridock-pep --help
          hybridock-tui --help

      - name: Build wheel
        run: |
          pip install --quiet build
          python -m build --wheel --outdir dist

      - name: Verify wheel in total isolation (no repo checkout nearby)
        shell: bash
        run: |
          set -e
          VENV_DIR="$RUNNER_TEMP/wheel_isolation_test"
          python -m venv "$VENV_DIR"
          if [ -f "$VENV_DIR/bin/python" ]; then VENV_PY="$VENV_DIR/bin/python"; else VENV_PY="$VENV_DIR/Scripts/python.exe"; fi
          WHEEL=$(ls dist/*.whl)
          "$VENV_PY" -m pip install --quiet "$WHEEL"
          cd "$RUNNER_TEMP"
          "$VENV_PY" -c "
          from hybridock_pep.scoring.affinity_model import _DEFAULT_ARTIFACT, _CRYSTAL_ARTIFACT
          from hybridock_pep.scoring.pose_ranker_ml import DEFAULT_MODEL_PATH
          from hybridock_pep.scoring.interaction_map import _DEFAULT_ARTIFACT as IFP_ARTIFACT
          import joblib
          for name, p in [('affinity_ai_nofix', _DEFAULT_ARTIFACT),
                          ('affinity_crystal_sizefix', _CRYSTAL_ARTIFACT),
                          ('pose_ranker_ml', DEFAULT_MODEL_PATH),
                          ('affinity_crystal_ifp', IFP_ARTIFACT)]:
              assert p.exists(), f'{name} artifact missing at {p}'
              joblib.load(p)
              print(f'{name}: OK ({p})')
          from hybridock_pep._vendor import calibrate_alpha, benchmark
          print('vendored calibrate_alpha, benchmark: import OK')
          "

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: wheel
          path: dist/*.whl
